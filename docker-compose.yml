x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://alocacao:${POSTGRES_PASSWORD:-troque-esta-senha}@db:5432/alocacao
  TZ: America/Sao_Paulo
  APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
  # assina sessões, avisos de tela e links de calendário: defina no .env para não mudar a cada deploy
  SECRET_KEY: ${SECRET_KEY:-}

# Modelo de IA: o .env escolhe o provedor (LLM_PROVIDER) e guarda as chaves; aqui só repassa.
# Vazio = padrão do app (veja .env.example).
x-ia-env: &ia-env
  LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-}
  # Ollama rodando no computador, fora do Docker (veja extra_hosts nos serviços)
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

services:
  db:
    # Postgres com pgvector: o mesmo banco pode guardar embeddings de contratos no futuro
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: alocacao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
      POSTGRES_DB: alocacao
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alocacao"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      <<: [*app-env, *ia-env]  # IA no painel: só para extrair exigências de contratos
      PAINEL_SENHA: ${PAINEL_SENHA:-}
      API_TOKEN: ${API_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /saude também confere o banco (SELECT 1)
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/saude', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  bot:
    # Telegram por long polling: não precisa expor porta nenhuma. Não depende do painel, só do banco.
    build: .
    command: ["python", "-m", "app.bot"]
    environment:
      <<: [*app-env, *ia-env]
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_USUARIOS_PERMITIDOS: ${TELEGRAM_USUARIOS_PERMITIDOS:-}
      AVISOS_EQUIPE: ${AVISOS_EQUIPE:-1}
      RESUMO_SEMANAL: ${RESUMO_SEMANAL:-1}
      AGENTE_DB: /dados/agente.db
    volumes:
      - agente:/dados
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  agente:
